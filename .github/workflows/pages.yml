name: Deploy to GitHub Pages

# Auto-deploys index.html and its assets to GitHub Pages every time main
# is updated. After this workflow runs successfully once, the live site is at
# https://<owner>.github.io/<repo>/ and any push refreshes it within ~1 minute.
#
# Forks of this repo: nothing to configure. The configure-pages step below
# uses enablement: true, which auto-creates the Pages site on first run.
#
# For this original repo: Pages was first initialized in "Deploy from a branch"
# mode, which Jekyll-builds the repo and ignores this workflow. To switch to
# this workflow's output, go to Settings -> Pages -> Source and pick
# "GitHub Actions" once. After that, every push to main publishes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-flight deploy if a newer one starts. Don't kill a deploy
# that's already mid-flight just because someone pushed twice.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run for forks. Uses the workflow's
          # pages: write token. No-op when Pages is already enabled.
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
